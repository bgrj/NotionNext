name: Record upstream sync

# One-shot: the push that adds this file records upstream as an ancestor of
# main and ourbeings.com. It does not rewrite site design files.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/record-upstream-sync.yml

permissions:
  contents: write

concurrency:
  group: record-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream into main
        run: |
          set -euo pipefail
          export LC_ALL=C
          git config user.name "bgrj"
          git config user.email "hsz@ourbeings.com"
          git fetch origin main
          git checkout -B main origin/main
          cp lib/db/notion/mapImage.js /tmp/mapImage.ours.js
          git fetch --no-tags https://github.com/notionnext-org/NotionNext.git main:refs/remotes/upstream/main
          if git merge --no-edit upstream/main; then
            echo "upstream merged cleanly"
          else
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            echo "conflicts:"
            printf '%s\n' "$conflicts"
            if [ "$conflicts" != "lib/db/notion/mapImage.js" ]; then
              echo "Refusing to merge: unexpected conflicts."
              exit 1
            fi
            cp /tmp/mapImage.ours.js lib/db/notion/mapImage.js
            git add lib/db/notion/mapImage.js
            git commit -m "Merge upstream notionnext-org/NotionNext main, keeping CodeQL-safe image URL parsing."
          fi
          changed="$(git diff --name-only HEAD^1 HEAD | sort)"
          echo "files changed from current main:"
          printf '%s\n' "$changed"
          if [ "$changed" != "$(printf '%s\n' docs/user-guide/changelog/v4-history.md yarn.lock)" ]; then
            echo "Refusing to push main: merge changed more than the lockfile and changelog."
            exit 1
          fi
          git merge-base --is-ancestor upstream/main HEAD
          git push origin HEAD:main
          echo "main is no longer behind upstream"
          git rev-list --left-right --count HEAD...upstream/main

      - name: Merge main into ourbeings.com without changing design
        run: |
          set -euo pipefail
          git config user.name "bgrj"
          git config user.email "hsz@ourbeings.com"
          git fetch origin ourbeings.com
          git checkout -B ourbeings.com origin/ourbeings.com
          before="$(git rev-parse 'HEAD^{tree}')"
          git merge -s ours --no-ff -m "Merge synced main into ourbeings.com without changing site design." main
          after="$(git rev-parse 'HEAD^{tree}')"
          if [ "$before" != "$after" ]; then
            echo "Refusing to push ourbeings.com: design tree changed."
            git diff --stat "$before" "$after" || true
            exit 1
          fi
          git merge-base --is-ancestor upstream/main HEAD
          git merge-base --is-ancestor main HEAD
          git push origin HEAD:ourbeings.com
          echo "ourbeings.com tree unchanged; upstream and main are ancestors"
          git rev-list --left-right --count HEAD...upstream/main
